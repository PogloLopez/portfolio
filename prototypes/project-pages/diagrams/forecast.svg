<!-- Weekly forecast pipeline, from ERP extract to replenishment -->
<svg viewBox="0 0 1164 344" width="100%" style="min-width:620px;height:auto" role="img" aria-label="The ERP feeds a daily ingest into a Bronze layer, refined into Silver features and Gold training frames. Series are split into eight taxonomic categories, each with its own LightGBM Tweedie model. A Syntetos-Boylan routing policy then decides per series whether to use that model or a four-week moving average, a guardrail caps the daily prediction, and the result feeds replenishment. A horizon audit checks the served forecast every week."><title>Weekly forecast pipeline, from ERP extract to replenishment</title><desc>The ERP feeds a daily ingest into a Bronze layer, refined into Silver features and Gold training frames. Series are split into eight taxonomic categories, each with its own LightGBM Tweedie model. A Syntetos-Boylan routing policy then decides per series whether to use that model or a four-week moving average, a guardrail caps the daily prediction, and the result feeds replenishment. A horizon audit checks the served forecast every week.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 75%, transparent)"></path></marker></defs><text x="106" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">SOURCE</text><text x="344" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">INGEST</text><text x="582" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">LAKE</text><text x="820" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">MODELLING</text><text x="1058" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="v