s)">SMA-4</text><text x="820" y="299.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">intermittent · lumpy ·</text><text x="820" y="312.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">new</text></g><g><rect x="970" y="48" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 20%, var(--color-surface))" stroke="var(--accent, var(--color-iris))" stroke-width="1.25"></rect><text x="1058" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Replenishment</text><text x="1058" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">merchandise reorder</text></g><g><rect x="970" y="154" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 10%, var(--color-surface))" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 70%, white)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="1058" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Horizon audit</text><text x="1058" y="200" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">weeks of usable forecast</text></g><g><rect x="970" y="260" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="1058" y="283.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">MLflow</text><text x="1058" y="299.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">runs · metrics ·</text><text x="1058" y="312.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">promotion</text></g></svg>
