96" height="17" rx="4" fill="var(--color-ground)" stroke="rgba(255,255,255,0.08)"></rect><text x="1066" y="140" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">audited weekly</text></g><g><rect x="18" y="48" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="106" y="71.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">ERP</text><text x="106" y="87.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">sales · stock · master</text><text x="106" y="100.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">data</text></g><g><rect x="256" y="48" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="344" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Daily ingest</text><text x="344" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">Dagster asset</text></g><g><rect x="494" y="48" width="176" height="66" rx="9" fill="var(--color-surface)" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 45%, transparent)" stroke-width="1.25"></rect><text x="582" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Bronze</text><text x="582" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">raw, append-only</text></g><g><rect x="494" y="154" width="176" height="66" rx="9" fill="var(--color-surface)" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 45%, transparent)" stroke-width="1.25"></rect><text x="582" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="