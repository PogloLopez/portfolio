<!-- From a weekly PDF bulletin to a price reading the buyers act on -->
<svg viewBox="0 0 1164 344" width="100%" style="min-width:620px;height:auto" role="img" aria-label="DANE bulletins are scraped and unit-normalised into a medallion lake. A 52-week forecast runs per product with model selection by multi-horizon MAPE. A language model writes the reading of each series once into the Gold layer, and the authenticated FastAPI application serves it to the commercial team from memory."><title>From a weekly PDF bulletin to a price reading the buyers act on</title><desc>DANE bulletins are scraped and unit-normalised into a medallion lake. A 52-week forecast runs per product with model selection by multi-horizon MAPE. A language model writes the reading of each series once into the Gold layer, and the authenticated FastAPI application serves it to the commercial team from memory.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 75%, transparent)"></path></marker></defs><text x="106" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">SOURCE</text><text x="344" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">INGEST</text><text x="582" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">LAKE</text><text x="820" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">INTELLIGENCE</text><text x="1058" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">DELIVERY</text><path d="M 194 187 L 256 187" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="