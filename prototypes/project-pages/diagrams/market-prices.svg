-accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><g><rect x="18" y="154" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="106" y="177.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">DANE SIPSA bulletins</text><text x="106" y="193.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">weekly · formatted for</text><text x="106" y="206.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">humans</text></g><g><rect x="256" y="48" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 10%, var(--color-surface))" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 70%, white)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="344" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Unit normalisation</text><text x="344" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">per-sheet, not global</text></g><g><rect x="256" y="154" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="344" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Scrape + parse</text><text x="344" y="200" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">schema drift tolerated</text></g><g><rect x="494" y="154" width="176" height="66" rx="9" fill="var(--color-surface)" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 45%, transparent)" stroke-width="1.25"></rect><text x="582" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Medallion lake</text><text x="582" y="200" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">Delta Lake · upserts</text></g><g><rect x="494" y="260" width="176" height="66" rx="9" fill="var(--color-surface)" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 45%, transparent)" stroke-width="1.25"></rect><text x="582" y="282.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Bronze / Silver /</text><text x="582" y="297.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Gold</text><text x="582" y="313.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">per-product series</text></g><g><rect x="732" y="48" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="820" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Model selection</text><text x="820" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">multi-horizon MAPE</text></g><g><rect x="732" y="154" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 20%, var(--color-surface))" stroke="var(--accent, var(--color-iris))" stroke-width="1.25"></rect><text x="820" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">52-week forecast</text><text x="820" y="200" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">XGBoost · LightGBM</text></g><g><rect x="732" y="260" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 20%, var(--color-surface))" stroke="var(--accent, var(--color-iris))" stroke-width="1.25"></rect><text x="820" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">LLM reading</text><text x="820" y="306" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">one paragraph per series</text></g><g><rect x="970" y="48" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 20%, var(--color-surface))" stroke="var(--accent, var(--color-iris))" stroke-width="1.25"></rect><text x="1058" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Commercial team</text><text x="1058" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">supplier negotiation</text></g><g><rect x="970" y="154" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="1058" y="177.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">FastAPI + HTMX</text><text x="1058" y="193.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">authenticated, on the</text><text x="1058" y="206.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">internet</text></g><g><rect x="970" y="260" width="176" height="66" rx="9" fill="var(--color-surface)" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 45%, transparent)" stroke-width="1.25"></rect><text x="1058" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Insight store</text><text x="1058" y="306" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">Gold table, read once</text></g></svg>
