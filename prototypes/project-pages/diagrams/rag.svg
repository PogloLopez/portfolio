<!-- Two answer paths, one source of numbers -->
<svg viewBox="0 0 1164 344" width="100%" style="min-width:620px;height:auto" role="img" aria-label="A question from Telegram hits an intent router that sends it down one of two paths. The certified path runs closed SQL recipes into a deterministic metric composer. The dynamic path has a language model write SQL, which is lexically validated and dry-run before it touches the warehouse. Both paths read from the same data warehouse, and every model call goes through a single paid-provider entry point."><title>Two answer paths, one source of numbers</title><desc>A question from Telegram hits an intent router that sends it down one of two paths. The certified path runs closed SQL recipes into a deterministic metric composer. The dynamic path has a language model write SQL, which is lexically validated and dry-run before it touches the warehouse. Both paths read from the same data warehouse, and every model call goes through a single paid-provider entry point.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 75%, transparent)"></path></marker></defs><text x="106" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">CHANNEL</text><text x="344" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">ROUTING</text><text x="582" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">PATH</text><text x="820" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">EXECUTION</text><text x="1058" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">ANSWER</text><path d="M 194 187 L 256 187" 