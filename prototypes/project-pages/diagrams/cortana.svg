<!-- Memory and runtime, split on purpose -->
<svg viewBox="0 0 1164 340" width="100%" style="min-width:620px;height:auto" role="img" aria-label="Requests arrive over Telegram or the web UI into a FastAPI runtime that dispatches to a lane per domain: memory, finance and calendar. Every lane&#x27;s irreversible actions pass through a human-in-the-loop gate before touching persistence. Long-term memory is a Git-versioned Markdown vault the runtime reconciles with rather than overwrites; transactional state is Postgres, with automatic backups."><title>Memory and runtime, split on purpose</title><desc>Requests arrive over Telegram or the web UI into a FastAPI runtime that dispatches to a lane per domain: memory, finance and calendar. Every lane&#x27;s irreversible actions pass through a human-in-the-loop gate before touching persistence. Long-term memory is a Git-versioned Markdown vault the runtime reconciles with rather than overwrites; transactional state is Postgres, with automatic backups.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 75%, transparent)"></path></marker></defs><g><rect x="244" y="22" width="676" height="312" rx="12" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 5%, transparent)" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 22%, transparent)" stroke-dasharray="6 5"></rect><text x="256" y="37" font-size="10.5" letter-spacing="0.9" fill="var(--accent, var(--color-iris))" font-family="var(--font-mono)">RUNTIME</text></g><g><rect x="958" y="22" width="200" height="312" rx="12" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 5%, transparent)" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 22%, transparent)" stroke-dasharray="6 5"></rect><text x="970" y="37" font-size="10.5" letter-spacing="0.9" fill="var(--accent, var(--color-iris))" font-family="var(--font-mono)">PERSISTENCE</text></g><path d="M 194 183 L 256 183" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 432 183 L 463 183 L 463 77 L 494 77" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 432 183 L 494 183" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 432 183 L 463 183 L 463 289 L 494 289" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 670 77 L 820 77 L 820 150" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 670 183 L 732 183" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 670 289 L 820 289 L 820 216" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 908 183 L 939 183 L 939 77 L 970 77" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 908 183 L 939 183 L 939 183 L 970 183" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 1058 216 L 1058 236 L 1058 236 L 1058 256" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><g><rect x="18" y="150" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="106" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Me</text><text x="106" y="196" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">Telegram · web UI</text></g><g><rect x="256" y="150" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="344" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">FastAPI runtime</text><text x="344" y="196" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">channel + orchestration</text></g><g><rect x="494" y="44" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="582" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Memory lane</text><text x="582" y="90" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">search · read · edit</text></g><g><rect x="494" y="150" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="582" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Finance lane</text><text x="582" y="196" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">statements · balances</text></g><g><rect x="494" y="256" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="582" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Calendar lane</text><text x="582" y="302" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">events · tasks</text></g><g><rect x="732" y="150" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 10%, var(--color-surface))" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 70%, white)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="820" y="172.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Human-in-the-loop</text><text x="820" y="187.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">gate</text><text x="820" y="203.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">nothing irreversible</text></g><g><rect x="970" y="44" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 20%, var(--color-surface))" stroke="var(--accent, var(--color-iris))" stroke-width="1.25"></rect><text x="1058" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Vault (Git)</text><text x="1058" y="90" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">Markdown · pull-first</text></g><g><rect x="970" y="150" width="176" height="66" rx="9" fill="var(--color-surface)" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 45%, transparent)" stroke-width="1.25"></rect><text x="1058" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Postgres</text><text x="1058" y="196" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">transactional state</text></g><g><rect x="970" y="256" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 10%, var(--color-surface))" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 70%, white)" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="1058" y="286" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Automatic backups</text><text x="1058" y="302" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">destructive ops blocked</text></g></svg>
