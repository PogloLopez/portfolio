<!-- One API where separate scripts used to be -->
<svg viewBox="0 0 1164 344" width="100%" style="min-width:620px;height:auto" role="img" aria-label="The operations team works in a plain-JavaScript web UI backed by a single FastAPI core that holds the transfer, buying-factor and reporting logic previously spread across standalone scripts. Dagster drives the recurring report runs, delivery goes out over the Gmail API with OAuth2, and SQL Server remains the transactional source."><title>One API where separate scripts used to be</title><desc>The operations team works in a plain-JavaScript web UI backed by a single FastAPI core that holds the transfer, buying-factor and reporting logic previously spread across standalone scripts. Dagster drives the recurring report runs, delivery goes out over the Gmail API with OAuth2, and SQL Server remains the transactional source.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 75%, transparent)"></path></marker></defs><text x="106" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">USERS</text><text x="344" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">INTERFACE</text><text x="582" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">PLATFORM</text><text x="820" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">DELIVERY</text><text x="1058" y="30" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="var(--color-fg-3)" font-family="var(--font-mono)">SYSTEMS</text><path d="M 194 187 L 256 187" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 432 187 L 494 187" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 432 81 L 582 81 L 582 154" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 582 260 L 582 240 L 582 240 L 582 220" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"></path><g><rect x="560" y="234" width="60" height="17" rx="4" fill="var(--color-ground)" stroke="rgba(255,255,255,0.08)"></rect><text x="590" y="246" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">migrated</text></g><path d="M 670 187 L 701 187 L 701 81 L 732 81" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 908 81 L 970 81" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 670 187 L 970 187" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><g><rect x="18" y="154" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="106" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Operations &amp; planning</text><text x="106" y="200" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">used to queue behind me</text></g><g><rect x="256" y="48" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="344" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Dagster</text><text x="344" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">recurring schedules</text></g><g><rect x="256" y="154" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="344" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Web UI</text><text x="344" y="200" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">plain JS, no build step</text></g><g><rect x="494" y="154" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 20%, var(--color-surface))" stroke="var(--accent, var(--color-iris))" stroke-width="1.25"></rect><text x="582" y="177.5" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">FastAPI core</text><text x="582" y="193.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">transfers · factors ·</text><text x="582" y="206.5" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">reports</text></g><g><rect x="494" y="260" width="176" height="66" rx="9" fill="transparent" stroke="rgba(255,255,255,0.16)" stroke-width="1.25" stroke-dasharray="4 5"></rect><text x="582" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Standalone scripts</text><text x="582" y="306" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">absorbed one at a time</text></g><g><rect x="732" y="48" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="820" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Gmail API</text><text x="820" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">OAuth2, not SMTP</text></g><g><rect x="970" y="48" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 20%, var(--color-surface))" stroke="var(--accent, var(--color-iris))" stroke-width="1.25"></rect><text x="1058" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Inboxes</text><text x="1058" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">no human in the loop</text></g><g><rect x="970" y="154" width="176" height="66" rx="9" fill="var(--color-surface)" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 45%, transparent)" stroke-width="1.25"></rect><text x="1058" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">SQL Server</text><text x="1058" y="200" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">transactional source</text></g></svg>
