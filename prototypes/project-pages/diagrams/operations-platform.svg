s)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M 670 187 L 732 187" fill="none" stroke="color-mix(in srgb, var(--accent, var(--color-iris)) 60%, transparent)" stroke-width="1.5" marker-end="url(#arrow)"></path><g><rect x="18" y="154" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="106" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Purchasing analysts</text><text x="106" y="200" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">review and run the plan</text></g><g><rect x="256" y="48" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="344" y="78" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Dagster</text><text x="344" y="94" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">recurring schedules</text></g><g><rect x="256" y="154" width="176" height="66" rx="9" fill="var(--color-surface-2)" stroke="rgba(255,255,255,0.18)" stroke-width="1.25"></rect><text x="344" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">Web app</text><text x="344" y="200" text-anchor="middle" font-size="10.5" fill="var(--color-fg-3)" font-family="var(--font-mono)">the transfer planner</text></g><g><rect x="494" y="154" width="176" height="66" rx="9" fill="color-mix(in srgb, var(--accent, var(--color-iris)) 20%, var(--color-surface))" stroke="var(--accent, var(--color-iris))" stroke-width="1.25"></rect><text x="582" y="184" text-anchor="middle" font-size="13" font-weight="600" fill="var(--color-fg)" font-family="var(--font-sans)">FastAPI core</text><text x="582" y="200" text-anchor="middle" font-size="10.5" fill="var(--colo